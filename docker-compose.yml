services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: net
      POSTGRES_USER: net
      POSTGRES_PASSWORD: net
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - net_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U net -d net"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - net_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  storage-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 1000:1000 /uploads"]
    volumes:
      - net_uploads:/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true
    pids_limit: 32

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://net:net@postgres:5432/net
      REDIS_URL: redis://redis:6379
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_APPLICATION_NAME: net-api
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-15000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:8080
      TRUST_PROXY_HOPS: 1
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to at least 32 random characters}
      LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-net-api}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-600}
      API_REQUEST_BURST: ${API_REQUEST_BURST:-120}
      API_MAX_ACTIVE_PER_IP: ${API_MAX_ACTIVE_PER_IP:-30}
      API_MAX_ACTIVE_GLOBAL: ${API_MAX_ACTIVE_GLOBAL:-1000}
      API_MAX_TRACKED_IPS: ${API_MAX_TRACKED_IPS:-50000}
      SOCKET_MAX_CONNECTIONS_PER_ACTOR: ${SOCKET_MAX_CONNECTIONS_PER_ACTOR:-5}
      SOCKET_ALLOW_NO_ORIGIN: "false"
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-10000}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-5000}
      HTTP_MAX_REQUESTS_PER_SOCKET: ${HTTP_MAX_REQUESTS_PER_SOCKET:-1000}
      UPLOAD_DIR: /app/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      BLOB_PREFIX: ${BLOB_PREFIX:-net-assets}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - net_uploads:/app/uploads
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: pnpm db:migrate
    environment:
      DATABASE_URL: postgresql://net:net@postgres:5432/net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://api:3001
        NEXT_PUBLIC_REALTIME_URL: /chat
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to at least 32 random characters}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?Set NEON_AUTH_BASE_URL for authenticated mode}
      NEON_AUTH_COOKIE_SECRET: ${NEON_AUTH_COOKIE_SECRET:?Set NEON_AUTH_COOKIE_SECRET}
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

volumes:
  net_postgres:
  net_redis:
  net_uploads:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#6f4ee8" />
    <title>Nét — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;display:grid;min-height:100vh;place-items:center;padding:24px;background:#fbfaf7;color:#27242e;font-family:system-ui,sans-serif}.card{max-width:430px;border:1px solid #e8e3eb;border-radius:26px;padding:34px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(44,37,55,.1)}img{width:72px;height:72px;border-radius:22px}h1{margin:18px 0 8px;font-family:Georgia,serif;font-size:32px}p{margin:0;color:#77727f;font-size:14px;line-height:1.6}button{min-height:44px;margin-top:22px;border:0;border-radius:13px;padding:12px 18px;background:#6f4ee8;color:#fff;font-weight:700}
    </style>
  </head>
  <body><main class="card"><img src="/icon-192.png" alt="Nét" /><h1 id="offline-title">You are offline</h1><p id="offline-copy">Reconnect to sync your conversations and continue unfinished drawings.</p><button id="offline-retry" onclick="location.reload()">Try Again</button></main><script>if(document.cookie.split('; ').includes('net_locale=vi')){document.documentElement.lang='vi';document.getElementById('offline-title').textContent='Bạn đang ngoại tuyến';document.getElementById('offline-copy').textContent='Kết nối lại để đồng bộ cuộc trò chuyện và tiếp tục những bản vẽ còn dang dở.';document.getElementById('offline-retry').textContent='Thử lại';}</script></body>
</html>

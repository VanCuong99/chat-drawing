map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_request_id $net_request_id {
  "~^[A-Za-z0-9._-]{8,128}$" $http_x_request_id;
  default $request_id;
}

log_format net_json escape=json '{'
  '"timestamp":"$time_iso8601",'
  '"requestId":"$net_request_id",'
  '"remoteAddress":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"requestBytes":$request_length,'
  '"responseBytes":$bytes_sent,'
  '"durationSeconds":$request_time,'
  '"upstreamSeconds":"$upstream_response_time",'
  '"requestLimit":"$limit_req_status",'
  '"connectionLimit":"$limit_conn_status"'
'}';

# Nginx uses shared-memory leaky buckets, so limits are shared by all workers
# in one proxy instance. A CDN/WAF is still required for volumetric DDoS.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=asset_upload_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=socket_handshake_per_ip:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_conn_zone $binary_remote_addr zone=asset_upload_connections:10m;
limit_conn_zone $binary_remote_addr zone=socket_connections_per_ip:10m;
limit_conn_zone $server_name zone=connections_per_server:10m;

upstream net_web {
  server web:3000;
  keepalive 32;
}

upstream net_api {
  server api:3001;
  keepalive 32;
}

server {
  listen 80;
  server_tokens off;
  access_log /dev/stdout net_json;
  error_log /dev/stderr warn;

  client_max_body_size 1m;
  client_body_buffer_size 128k;
  client_header_timeout 10s;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  keepalive_requests 500;
  send_timeout 30s;
  reset_timedout_connection on;
  large_client_header_buffers 2 8k;

  limit_conn connections_per_ip 40;
  limit_conn connections_per_server 2000;
  limit_conn_status 429;

  add_header X-Request-ID $net_request_id always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /api/assets {
    client_max_body_size 8m;
    limit_req zone=asset_upload_per_ip burst=10 nodelay;
    limit_req_status 429;
    limit_conn connections_per_ip 40;
    limit_conn connections_per_server 2000;
    limit_conn asset_upload_connections 4;
    limit_conn_status 429;
    proxy_request_buffering on;
    proxy_pass http://net_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $net_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://net_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $net_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
  }

  location /socket.io/ {
    limit_req zone=socket_handshake_per_ip burst=10 nodelay;
    limit_req_status 429;
    limit_conn connections_per_ip 40;
    limit_conn connections_per_server 2000;
    limit_conn socket_connections_per_ip 8;
    limit_conn_status 429;
    proxy_pass http://net_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $net_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_send_timeout 15s;
  }

  location / {
    limit_req zone=web_per_ip burst=100 nodelay;
    limit_req_status 429;
    proxy_pass http://net_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $net_request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    # Self-hosted ingress must never let a browser forge platform identity.
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";
  }
}
